plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.morteza.nourani.musix'
version = '0.0.0'

android {
  namespace "expo.modules.musicmetadata"
  defaultConfig {
    versionCode 1
    versionName "0.0.0"
  }
}

dependencies {
  implementation 'androidx.activity:activity-ktx:1.11.0'
  implementation 'net.jthink:jaudiotagger:3.0.1'
}
